name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create iOS Skeleton
        run: |
          mkdir -p /tmp/my_lib
          cp lib/main.dart /tmp/my_lib/main.dart
          flutter create . --project-name=workshop_copilot --platforms=ios --org=com.workshop
          cp /tmp/my_lib/main.dart lib/main.dart

      - name: Add Packages
        run: flutter pub add speech_to_text flutter_tts http

      - name: Configure Microphone & Speech Permissions
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Ứng dụng cần micro để nghe tiếng Trung'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Ứng dụng cần nhận diện giọng nói'" $PLIST || true

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package to IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r WorkshopCopilot.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopCopilot-IPA
          path: build/ios/iphoneos/WorkshopCopilot.ipa
