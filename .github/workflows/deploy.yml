name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Complete Flutter Project
        run: |
          rm -rf *
          flutter create . --project-name=workshop_copilot --platforms=ios --org=com.workshop

      - name: Inject Dependencies
        run: |
          flutter pub add speech_to_text flutter_tts http

      - name: Generate Clean main.dart
        run: |
          python3 -c "
          code = '''import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:http/http.dart' as http;

          void main() => runApp(const WorkshopApp());

          class WorkshopApp extends StatelessWidget {
            const WorkshopApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F1115),
                ),
                home: const CopilotScreen(),
              );
            }
          }

          class CopilotScreen extends StatefulWidget {
            const CopilotScreen({super.key});

            @override
            State<CopilotScreen> createState() => _CopilotScreenState();
          }

          class _CopilotScreenState extends State<CopilotScreen> {
            final String deepseekApiKey = 'sk-mock-key';

            late stt.SpeechToText _speech;
            late FlutterTts _tts;

            bool _isListening = false;
            bool _isLoading = false;
            String _recognizedText = 'Nhấn giữ nút để nghe tiếng Trung...';
            String _vietnameseMeaning = '';
            String _chineseReply = '';
            String _pinyin = '';

            @override
            void initState() {
              super.initState();
              _speech = stt.SpeechToText();
              _tts = FlutterTts();
              _initAudioEngine();
            }

            void _initAudioEngine() async {
              await _speech.initialize();
              await _tts.setLanguage('vi-VN');
              await _tts.setSpeechRate(0.55);
            }

            void _startListening() async {
              bool available = await _speech.initialize();
              if (available) {
                setState(() {
                  _isListening = true;
                  _recognizedText = 'Đang lắng nghe đối phương nói...';
                });
                _speech.listen(
                  localeId: 'zh_CN',
                  onResult: (val) {
                    setState(() {
                      _recognizedText = val.recognizedWords;
                    });
                  },
                );
              }
            }

            void _stopListeningAndProcess() async {
              await _speech.stop();
              setState(() => _isListening = false);

              if (_recognizedText.isNotEmpty && !_recognizedText.contains('...')) {
                _fetchDeepSeekAssist(_recognizedText);
              }
            }

            Future<void> _fetchDeepSeekAssist(String text) async {
              setState(() => _isLoading = true);

              const systemPrompt = '''Bạn là Kỹ sư trưởng xưởng sản xuất. Đối phương vừa nói tiếng Trung:
          Hãy phân tích và trả về đúng 3 dòng định dạng sau:
          NGHIA: [Bản dịch tiếng Việt chuẩn thuật ngữ kỹ thuật nhà xưởng]
          DAP: [Một câu đối đáp ngắn gọn, sắc bén bằng chữ Hán]
          PINYIN: [Phiên âm Pinyin kèm thanh điệu]''';

              try {
                final response = await http.post(
                  Uri.parse('https://api.deepseek.com/chat/completions'),
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + deepseekApiKey,
                  },
                  body: jsonEncode({
                    'model': 'deepseek-chat',
                    'messages': [
                      {'role': 'system', 'content': systemPrompt},
                      {'role': 'user', 'content': text}
                    ],
                    'temperature': 0.2,
                    'max_tokens': 120
                  }),
                );

                if (response.statusCode == 200) {
                  final data = jsonDecode(utf8.decode(response.bodyBytes));
                  String reply = data['choices'][0]['message']['content'];

                  String nghia = '';
                  String dap = '';
                  String pinyin = '';

                  for (var line in reply.split('\n')) {
                    if (line.startsWith('NGHIA:')) nghia = line.replaceFirst('NGHIA:', '').trim();
                    if (line.startsWith('DAP:')) dap = line.replaceFirst('DAP:', '').trim();
                    if (line.startsWith('PINYIN:')) pinyin = line.replaceFirst('PINYIN:', '').trim();
                  }

                  setState(() {
                    _vietnameseMeaning = nghia;
                    _chineseReply = dap;
                    _pinyin = pinyin;
                  });

                  if (nghia.isNotEmpty) {
                    await _tts.speak(nghia);
                  }
                }
              } catch (e) {
                setState(() => _vietnameseMeaning = 'Lỗi kết nối: ' + e.toString());
              } finally {
                setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('COPILOT KỸ THUẬT XƯỞNG', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                  centerTitle: true,
                  backgroundColor: const Color(0xFF1E222B),
                ),
                body: SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(16.0),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        Container(
                          padding: const EdgeInsets.all(14),
                          decoration: BoxDecoration(
                            color: const Color(0xFF161A22),
                            borderRadius: BorderRadius.circular(10),
                            border: Border.all(color: Colors.blueGrey.shade800),
                          ),
                          child: Text(_recognizedText, style: const TextStyle(fontSize: 16, color: Colors.white70)),
                        ),
                        const SizedBox(height: 16),
                        Expanded(
                          child: Container(
                            padding: const EdgeInsets.all(18),
                            decoration: BoxDecoration(
                              color: const Color(0xFF1E222B),
                              borderRadius: BorderRadius.circular(14),
                              border: Border.all(color: _chineseReply.isNotEmpty ? Colors.amber : Colors.transparent, width: 2),
                            ),
                            child: _isLoading
                                ? const Center(child: CircularProgressIndicator(color: Colors.amber))
                                : SingleChildScrollView(
                                    child: Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        const Text('NGHĨA TIẾNG VIỆT:', style: TextStyle(color: Colors.grey, fontSize: 12, fontWeight: FontWeight.bold)),
                                        const SizedBox(height: 4),
                                        Text(_vietnameseMeaning.isEmpty ? '...' : _vietnameseMeaning, style: const TextStyle(fontSize: 18, color: Colors.greenAccent, fontWeight: FontWeight.w600)),
                                        const Divider(height: 30, color: Colors.white24),
                                        const Text('CÂU TRẢ LỜI ĐỀ XUẤT:', style: TextStyle(color: Colors.grey, fontSize: 12, fontWeight: FontWeight.bold)),
                                        const SizedBox(height: 8),
                                        Text(_chineseReply.isEmpty ? '...' : _chineseReply, style: const TextStyle(fontSize: 32, color: Colors.amber, fontWeight: FontWeight.bold)),
                                        const SizedBox(height: 6),
                                        Text(_pinyin.isEmpty ? '' : _pinyin, style: const TextStyle(fontSize: 18, color: Colors.lightBlueAccent, fontStyle: FontStyle.italic)),
                                      ],
                                    ),
                                  ),
                          ),
                        ),
                        const SizedBox(height: 20),
                        GestureDetector(
                          onTapDown: (_) => _startListening(),
                          onTapUp: (_) => _stopListeningAndProcess(),
                          child: Container(
                            height: 75,
                            decoration: BoxDecoration(
                              color: _isListening ? Colors.redAccent : Colors.amber.shade700,
                              borderRadius: BorderRadius.circular(16),
                            ),
                            child: Center(
                              child: Text(
                                _isListening ? 'ĐANG THU ÂM...' : 'GIỮ ĐỂ BẮT TIẾNG TRUNG',
                                style: const TextStyle(fontSize: 17, fontWeight: FontWeight.bold, color: Colors.black),
                              ),
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }
          '''
          with open('lib/main.dart', 'w', encoding='utf-8') as f:
              f.write('\n'.join([line.strip() for line in code.splitlines()]))
          "

      - name: Configure Microphone & Speech Permissions
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Ứng dụng cần micro để nghe tiếng Trung'" $PLIST || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'Ứng dụng cần nhận diện giọng nói'" $PLIST || true

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Compress App to IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r WorkshopCopilot.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopCopilot-IPA
          path: build/ios/iphoneos/WorkshopCopilot.ipa
